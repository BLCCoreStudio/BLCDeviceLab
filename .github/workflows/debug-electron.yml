name: One-shot Electron diagnostics

on:
  push:
    branches:
      - fix/runtime-ci-hardening
    paths:
      - .github/workflows/debug-electron.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/runtime-ci-hardening
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Capture Electron output
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum npx --no-install electron --version > electron-smoke.txt 2>&1
          status=$?
          echo "exit_status=$status" >> electron-smoke.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f electron-smoke.txt
          git commit -m "ci: capture Linux Electron smoke output"
          git push origin HEAD:fix/runtime-ci-hardening
