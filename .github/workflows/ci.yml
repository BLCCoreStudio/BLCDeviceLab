name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Install Linux display smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Electron binary smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ELECTRON_PATH="$(node -p "require('electron')")"
          SANDBOX_PATH="$(dirname "$ELECTRON_PATH")/chrome-sandbox"
          test -x "$ELECTRON_PATH"
          test -f "$SANDBOX_PATH"
          sudo chown root:root "$SANDBOX_PATH"
          sudo chmod 4755 "$SANDBOX_PATH"
          xvfb-run --auto-servernum "$ELECTRON_PATH" --version
      - name: Electron binary smoke
        if: runner.os != 'Linux'
        run: npx --no-install electron --version
