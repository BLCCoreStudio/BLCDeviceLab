name: One-shot Electron final diagnostics

on:
  push:
    branches:
      - fix/runtime-ci-hardening
    paths:
      - .github/workflows/debug-electron-final.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/runtime-ci-hardening
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Capture resolved Electron smoke
        shell: bash
        run: |
          set +e
          {
            ELECTRON_PATH="$(node -p "require('electron')")"
            echo "electron_path=$ELECTRON_PATH"
            SANDBOX_PATH="$(dirname "$ELECTRON_PATH")/chrome-sandbox"
            echo "sandbox_path=$SANDBOX_PATH"
            ls -l "$ELECTRON_PATH" "$SANDBOX_PATH"
            sudo chown root:root "$SANDBOX_PATH"
            echo "chown_status=$?"
            sudo chmod 4755 "$SANDBOX_PATH"
            echo "chmod_status=$?"
            ls -l "$SANDBOX_PATH"
            xvfb-run --auto-servernum "$ELECTRON_PATH" --version
            echo "electron_status=$?"
          } > electron-final.txt 2>&1
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f electron-final.txt
          git commit -m "ci: capture resolved Linux Electron failure"
          git push origin HEAD:fix/runtime-ci-hardening
